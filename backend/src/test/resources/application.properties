# H2 in MySQL mode
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Disable Flyway for tests
spring.flyway.enabled=false

# JWT
jwt.secret=testsecretkeythatisatleast32characterslong1234567890

# Gemini AI (dummy key for tests)
gemini.api.key=test-gemini-key

# Disable Redis for tests
spring.data.redis.repositories.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# Disable Mail for tests
spring.mail.host=localhost
spring.mail.port=25
mail.enabled=false

# Disable OAuth for tests
spring.security.oauth2.client.registration.google.client-id=test
spring.security.oauth2.client.registration.google.client-secret=test

# Disable Docker/sandbox for tests
judge.sandbox.container=devhacks-sandbox-persistent
