---
# =============================================
#  DevHacks — Ansible Playbook
#  Provisions: Docker, Java 17, Jenkins, SonarQube
# =============================================

- name: DevHacks Server Setup
  hosts: devops
  become: true
  vars:
    jenkins_port: 8081      # 8080 is used by Spring Boot backend
    sonar_port: 9000
    grafana_port: 3000

  tasks:

    # ---------- System ----------
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install core packages
      apt:
        name:
          - curl
          - wget
          - unzip
          - git
          - ca-certificates
          - gnupg
          - lsb-release
          - apt-transport-https
          - python3-pip
        state: present

    # ---------- Fix SonarQube vm.max_map_count (persistent) ----------
    - name: Set vm.max_map_count for SonarQube (runtime)
      command: sysctl -w vm.max_map_count=262144

    - name: Set vm.max_map_count persistent across reboots
      lineinfile:
        path: /etc/sysctl.conf
        line: "vm.max_map_count=262144"
        state: present

    # ---------- Java 17 ----------
    - name: Install Java 17
      apt:
        name: openjdk-17-jdk
        state: present

    - name: Verify Java version
      command: java -version
      register: java_version
      changed_when: false

    # ---------- Docker ----------
    - name: Add Docker GPG key
      shell: |
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | \
        gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
      args:
        creates: /usr/share/keyrings/docker-archive-keyring.gpg

    - name: Add Docker apt repository
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Start and enable Docker
      systemd:
        name: docker
        enabled: yes
        state: started

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    # ---------- Jenkins (Docker container on port 8081) ----------
    # NOTE: Jenkins runs on 8081 because 8080 is used by the Spring Boot backend
    - name: Create Jenkins data volume
      community.docker.docker_volume:
        name: jenkins_home

    - name: Run Jenkins container
      community.docker.docker_container:
        name: jenkins
        image: jenkins/jenkins:lts-jdk17
        state: started
        restart_policy: unless-stopped
        published_ports:
          - "{{ jenkins_port }}:8080"
          - "50000:50000"
        volumes:
          - jenkins_home:/var/jenkins_home
          - /var/run/docker.sock:/var/run/docker.sock

    # ---------- SonarQube (Docker container) ----------
    - name: Create SonarQube data volumes
      community.docker.docker_volume:
        name: "{{ item }}"
      loop:
        - sonar_data
        - sonar_logs
        - sonar_extensions

    - name: Run SonarQube container
      community.docker.docker_container:
        name: sonarqube
        image: sonarqube:community
        state: started
        restart_policy: unless-stopped
        published_ports:
          - "{{ sonar_port }}:9000"
        volumes:
          - sonar_data:/opt/sonarqube/data
          - sonar_logs:/opt/sonarqube/logs
          - sonar_extensions:/opt/sonarqube/extensions
        env:
          SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"

    # ---------- Grafana (Docker container) ----------
    - name: Create Grafana data volume
      community.docker.docker_volume:
        name: grafana_data

    - name: Run Grafana container
      community.docker.docker_container:
        name: grafana
        image: grafana/grafana:latest
        state: started
        restart_policy: unless-stopped
        published_ports:
          - "{{ grafana_port }}:3000"
        volumes:
          - grafana_data:/var/lib/grafana
        env:
          GF_SECURITY_ADMIN_PASSWORD: "admin"

    # ---------- Clone repo ----------
    - name: Clone DevHacks repository
      git:
        repo: https://github.com/Sumit-Rathod-06/Devhacks.git
        dest: /opt/devhacks
        version: main
        force: yes

    - name: Set repo ownership
      file:
        path: /opt/devhacks
        owner: ubuntu
        group: ubuntu
        recurse: yes

    # ---------- Summary ----------
    - name: Print access info
      debug:
        msg:
          - "✅ Setup complete!"
          - "Jenkins  → http://{{ ansible_host }}:{{ jenkins_port }}"
          - "SonarQube → http://{{ ansible_host }}:{{ sonar_port }}"
          - "Grafana  → http://{{ ansible_host }}:{{ grafana_port }}"
          - "Get Jenkins password: docker exec jenkins cat /var/jenkins_home/secrets/initialAdminPassword"
